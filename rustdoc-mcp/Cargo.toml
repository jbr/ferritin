[package]
name = "rustdoc-mcp"
version = "0.10.0"
edition.workspace = true
description = "mcp server for rustdocs"
readme = "./README.md"
repository.workspace = true
documentation = "https://docs.rs/rustdoc-mcp"
license.workspace = true
keywords = ["mcp"]
categories = []

# dist tags releases per-package as `{crate}-v{version}` (workspace with multiple
# publishable crates), but cargo-binstall's built-in dist auto-detection only
# guesses `v{version}`/`{version}` tags. These templates point binstall at the
# real prefixed tag and the binary's path inside the tarball.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/{ name }-v{ version }/{ name }-{ target }{ archive-suffix }"
pkg-fmt = "txz"
bin-dir = "{ name }-{ target }/{ bin }{ binary-ext }"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

[dependencies]
ferritin-common = { path = "../ferritin-common", version = "0.18.0" }
anyhow.workspace = true
clap = { version = "4.6.7", features = ["derive"] }
env_logger = "0.11.11"
log = "0.4.34"
mcplease = "0.5"
rustdoc-types.workspace = true
schemars = { version = "1.2.3", features = ["derive"] }
serde.workspace = true
shellexpand.workspace = true
strum = { version = "0.28.0", features = ["derive"] }
fieldwork = "0.5.5"
semver = "1.0.28"
smol = "2"

[dev-dependencies]
tempfile = "3.27.0"
insta = { version = "1.49", features = ["yaml", "filters"] }
