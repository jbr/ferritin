[workspace]
resolver = "3"
members = ["ferritin-common", "rustdoc-mcp", "ferritin"]
exclude = ["rustdoc-mcp/tests/fixture-crate", "rustdoc-mcp/tests/test-workspace"]

[workspace.package]
edition = "2024"
repository = "https://github.com/jbr/ferritin"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
anyhow = "1.0.102"
cargo_metadata = "0.23.1"
elsa = "1.11.2"
rustc-hash = { version = "2.1.2" }
rustdoc-types = { version = "0.60", features = ["rustc-hash", "rkyv_0_8"] }
serde = { version = "1.0.228", features = ["derive"] }
shellexpand = "3.1.2"
sonic-rs = "0.5.8"
strsim = "0.11.1"
walkdir = "2.5.0"

# The profile that 'dist' will build with. dist defaults to thin LTO to keep CI
# build time/memory bounded, but the whole point of shipping a prebuilt binary is
# paying the optimization cost once so users don't. ferritin does multi-second
# CPU-bound work (per-crate search indexing), so fat LTO + single codegen unit
# is worth the longer release build.
[profile.dist]
inherits = "release"
lto = true
codegen-units = 1
