name: CI

on:
  pull_request:
  push:
    branches:
      - main

env:
  RUSTFLAGS: -Dwarnings

jobs:
  test:
    name: Build and Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        rust: [nightly]
    steps:
    - uses: actions/checkout@master
      with:
        submodules: recursive
    - name: Install ${{ matrix.rust }}
      uses: actions-rs/toolchain@v1
      with:
        toolchain: ${{ matrix.rust }}
        components: rustfmt, clippy, rust-docs-json
        override: true

    - name: Rust Cache
      uses: Swatinem/rust-cache@v2.9.1

    - name: Run tests
      uses: actions-rs/cargo@v1
      with:
        command: test
        args: --all --no-fail-fast

  serve:
    name: Serve and Acme Features
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@master
      with:
        submodules: recursive
    - uses: dtolnay/rust-toolchain@nightly
      with:
        components: clippy

    # `serve` is off by default, so no other job compiles the server, the
    # typeahead service, or their JSON DTOs. Node is required because
    # `trillium_frontend::frontend!` shells out to the client's pnpm build at
    # macro-expansion time — expanding the macro *is* building the web client.
    # Exact, and not 11.12+: pnpm's self-update path crashes when action-setup
    # bootstraps it (pnpm/action-setup#276, pnpm/pnpm#12959), so the action dies
    # before it can install anything. Unpin once that lands; the pin must match
    # `packageManager` in client/package.json or pnpm self-switches into the bug.
    - uses: pnpm/action-setup@v6
      with:
        version: 11.11.0
    - uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: pnpm
        cache-dependency-path: client/pnpm-lock.yaml

    - uses: Swatinem/rust-cache@v2.9.1

    # `serve` alone first: `acme` implies it, so only this step proves the server
    # still compiles without the ACME/HTTP-3 stack that deployment adds.
    - name: Clippy (--features serve)
      run: cargo clippy -p ferritin --features serve --all-targets

    # `acme` is only ever enabled by the deployment build, so nothing else in CI
    # compiles the trillium-acme/quinn listener setup or the code behind its
    # cfgs.
    - name: Clippy (--features acme)
      run: cargo clippy -p ferritin --features acme --all-targets

    # The openapi.json drift guard lives behind `#[cfg(feature = "schema")]`, so
    # the main `cargo test --all` job (default features) never compiles it, let
    # alone runs it. Filtered to that one test: the rest of the suite already ran
    # there, and the ferritin bin's other tests want the rust-docs-json component
    # this job has no reason to install.
    - name: Schema drift guard (--features schema)
      run: cargo test -p ferritin --features schema --bin ferritin committed_schema_is_up_to_date

  client:
    name: Client
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
    # No submodules and no rust toolchain: the client's checks are pure node, and
    # the `frontend!` macro (the only thing that couples them) is the serve job's
    # concern, not this one.
    - uses: actions/checkout@v7
    # Exact, and not 11.12+: pnpm's self-update path crashes when action-setup
    # bootstraps it (pnpm/action-setup#276, pnpm/pnpm#12959), so the action dies
    # before it can install anything. Unpin once that lands; the pin must match
    # `packageManager` in client/package.json or pnpm self-switches into the bug.
    - uses: pnpm/action-setup@v6
      with:
        version: 11.11.0
    - uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: pnpm
        cache-dependency-path: client/pnpm-lock.yaml

    - name: Install
      run: pnpm install --frozen-lockfile

    # typecheck && lint && format:check && test — the same command the client's
    # own `pnpm check` runs locally.
    - name: Check
      run: pnpm run check

  check_fmt_and_docs:
    name: Lints and Docs
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@master
      with:
        submodules: recursive
    - uses: actions-rs/toolchain@v1
      with:
        toolchain: nightly
        components: rustfmt, clippy
        override: true

    - uses: giraffate/clippy-action@v1
      with:
        reporter: 'github-pr-review'
        
    - name: Format
      run: cargo fmt --all -- --check

    - name: Docs
      run: cargo doc --no-deps
  coverage:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: taiki-e/cache-cargo-install-action@v3
        with:
          tool: cargo-expand
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: llvm-tools-preview, rust-docs-json
      - uses: Swatinem/rust-cache@v2
      - name: Install latest nextest release
        uses: taiki-e/install-action@nextest
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Collect coverage data
        run: cargo llvm-cov nextest --codecov --output-path codecov.json
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: codecov.json

