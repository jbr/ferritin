name: CI

on:
  pull_request:
  push:
    branches:
      - main

env:
  RUSTFLAGS: -Dwarnings

jobs:
  test:
    name: Build and Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        rust: [nightly]
    steps:
    - uses: actions/checkout@master
      with:
        submodules: recursive
    - name: Install ${{ matrix.rust }}
      uses: actions-rs/toolchain@v1
      with:
        toolchain: ${{ matrix.rust }}
        components: rustfmt, clippy, rust-docs-json
        override: true

    - name: Rust Cache
      uses: Swatinem/rust-cache@v2.9.1

    - name: Run tests
      uses: actions-rs/cargo@v1
      with:
        command: test
        args: --all --no-fail-fast

  serve:
    name: Serve Feature
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@master
      with:
        submodules: recursive
    - uses: dtolnay/rust-toolchain@nightly
      with:
        components: clippy

    # `serve` is off by default, so no other job compiles the server, the
    # typeahead service, or their JSON DTOs. Node is required because
    # `trillium_frontend::frontend!` shells out to the client's pnpm build at
    # macro-expansion time — expanding the macro *is* building the web client.
    - uses: pnpm/action-setup@v6
      with:
        version: 11
    - uses: actions/setup-node@v6
      with:
        node-version: 24
        cache: pnpm
        cache-dependency-path: client/pnpm-lock.yaml

    - uses: Swatinem/rust-cache@v2.9.1

    - name: Clippy (--features serve)
      run: cargo clippy -p ferritin --features serve --all-targets

  client:
    name: Client
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
    # No submodules and no rust toolchain: the client's checks are pure node, and
    # the `frontend!` macro (the only thing that couples them) is the serve job's
    # concern, not this one.
    - uses: actions/checkout@v7
    - uses: pnpm/action-setup@v6
      with:
        version: 11
    - uses: actions/setup-node@v6
      with:
        node-version: 24
        cache: pnpm
        cache-dependency-path: client/pnpm-lock.yaml

    - name: Install
      run: pnpm install --frozen-lockfile

    # typecheck && lint && format:check && test — the same command the client's
    # own `pnpm check` runs locally.
    - name: Check
      run: pnpm run check

  check_fmt_and_docs:
    name: Lints and Docs
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@master
      with:
        submodules: recursive
    - uses: actions-rs/toolchain@v1
      with:
        toolchain: nightly
        components: rustfmt, clippy
        override: true

    - uses: giraffate/clippy-action@v1
      with:
        reporter: 'github-pr-review'
        
    - name: Format
      run: cargo fmt --all -- --check

    - name: Docs
      run: cargo doc --no-deps
  coverage:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: taiki-e/cache-cargo-install-action@v3
        with:
          tool: cargo-expand
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: llvm-tools-preview, rust-docs-json
      - uses: Swatinem/rust-cache@v2
      - name: Install latest nextest release
        uses: taiki-e/install-action@nextest
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Collect coverage data
        run: cargo llvm-cov nextest --codecov --output-path codecov.json
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: codecov.json

