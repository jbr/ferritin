name: Release-plz

permissions:
  pull-requests: write
  contents: write
  id-token: write

on:
  push:
    branches:
      - main

jobs:
  release-plz:
    name: Release-plz
    runs-on: ubuntu-latest
    environment: release
    steps:
      # Mint a token from our GitHub App so release-plz's tag push is attributed
      # to the App, not the built-in GITHUB_TOKEN. GitHub deliberately refuses to
      # let a GITHUB_TOKEN-pushed tag trigger another workflow, which would leave
      # dist's release.yml (on: push: tags) silently un-triggered.
      - name: Generate GitHub App token
        uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
          token: ${{ steps.app-token.outputs.token }}
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly

      # ferritin's `include` ships `client/dist`, so the published crate can build
      # `--features serve` without a node toolchain. But `serve` is off by default,
      # so the `frontend!` macro that would build the client never expands during
      # packaging — nothing here would otherwise create `dist`, and an `include`
      # glob matching nothing is not an error. Without this step we would publish a
      # crate whose `serve` feature fails to compile, silently.
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml
      - name: Build web client
        working-directory: client
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - name: Run release-plz
        uses: MarcoIeni/release-plz-action@v0.5
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
