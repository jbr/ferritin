[package]
name = "ferritin-common"
version = "0.19.0"
edition.workspace = true
description = "library for rustdoc navigation and search"
readme = "README.md"
repository.workspace = true
license.workspace = true

[dependencies]
trillium-rustls = { version = "0.11.3", features = ["client"] }
trillium-smol = "0.7.0"
anyhow.workspace = true
cargo_metadata.workspace = true
elsa.workspace = true
fieldwork = "0.5.3"
log = "0.4.34"
memmap2 = "0.9.11"
rkyv = "0.8.18"
rustc-hash.workspace = true
rustdoc-types.workspace = true
serde.workspace = true
strsim.workspace = true
trillium-client = "0.9.18"
walkdir.workspace = true
zstd = "0.14"
home = "0.5.12"
async-fs = "2.2.0"
semver = { version = "1.0.28", features = ["serde"] }
# The unbounded-depth pair: rustdoc JSON deserialization (conversions) —
# type nesting is unbounded in the wild (typenum), so the one deep JSON
# surface uses serde_json + stacker; sonic-rs (hard 255-layer cap) handles
# the shallow surfaces (response serialization, metadata).
serde_json = { version = "1.0", features = ["unbounded_depth"] }
serde_stacker = "0.1"
sonic-rs = "0.5.8"
rayon = "1.12.0"
memchr = "2.8.3"
trillium-redirect = { version = "0.3.0", features = ["client"] }
trillium-logger = { version = "0.5.5", features = ["client"] }
trillium-compression = { version = "0.3.4", features = ["client"] }
trillium-client-retry = "0.0.1"
crate-names = "0.3.0"
async-lock = "3"
httpdate = "1.0.3"
rust-stemmers = "1.2.0"

[dev-dependencies]
env_logger = "0.11.11"
pulldown-cmark = "0.13.4"
# verifies the pinned typeahead-battery fixtures (crate_names::battery)
sha2 = "0.11"
