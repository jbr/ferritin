[package]
name = "ferritin"
version = "0.13.0"
edition.workspace = true
description = "Human-friendly CLI for browsing Rust documentation"
readme = "../README.md"
repository.workspace = true
license.workspace = true
include = [
    "src/**/*",
    "build.rs",
    "assets/**/*.tmTheme",
    "CHANGELOG.md",
    "client/dist/",
]

# dist tags releases per-package as `{crate}-v{version}` (workspace with multiple
# publishable crates), but cargo-binstall's built-in dist auto-detection only
# guesses `v{version}`/`{version}` tags. These templates point binstall at the
# real prefixed tag and the binary's path inside the tarball.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/{ name }-v{ version }/{ name }-{ target }{ archive-suffix }"
pkg-fmt = "txz"
bin-dir = "{ name }-{ target }/{ bin }{ binary-ext }"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

[dependencies]
ferritin-common = { path = "../ferritin-common", version = "0.14.0" }

anyhow.workspace = true
clap = { version = "4.6.1", features = ["derive", "cargo", "env"] }
crossbeam-channel = "0.5"
crossterm = "0.29"
fieldwork = "0.5.2"
log = "0.4.33"
env_logger = "0.11.11"
pulldown-cmark = "0.13"
ratatui = "0.30"
regex = "1.13"
rustdoc-types.workspace = true
serde.workspace = true
sonic-rs.workspace = true
syntect = { version = "5.3", default-features = false, features = ["parsing", "default-syntaxes", "html", "plist-load", "yaml-load", "dump-load", "dump-create", "regex-onig"] }
terminal_size = "0.4"
thiserror = "2"
unicode-width = "0.2.2"
webbrowser = "1.2.1"
semver = "1.0.28"
percent-encoding = "2.3"
mimalloc = "0.1.52"
trillium = "1.3.0"
trillium-frontend = "0.4.0"
trillium-html-rewriter = "0.6.0"
trillium-api = { version = "0.3.0", features = ["sonic-rs", "url"] }
trillium-logger = { version = "0.5.4", features = ["client"] }
trillium-rustls = "0.11.3"
trillium-smol = "0.7.0"
trillium-router = "0.5.2"
querystrong = "0.4.0"
trillium-client = "0.9.11"
schemars = { version = "1.2.1", optional = true }
rayon = "1.12.0"
async-channel = "2.5.0"
trillium-caching-headers = "0.4.1"
trillium-compression = {version = "0.3.3", features = ["client"]}



[build-dependencies]
syntect = { version = "5.3", default-features = false, features = ["parsing", "plist-load", "dump-load", "dump-create", "regex-onig"] }

[dev-dependencies]
insta = { version = "1.48.0", features = ["filters"] }
paste = "1.0.15"
strip-ansi-escapes = "0.2.1"

[[bin]]
name = "ferritin"
path = "src/main.rs"

[features]
# Development-only: emit the OpenAPI schema for the JSON API (`ferritin schema`).
# Off by default so normal builds don't pull in schemars; the generated schema is
# committed under assets/ and regenerated as a dev task.
schema = ["dep:schemars"]
dev-proxy = ["trillium-frontend/dev-proxy"]
