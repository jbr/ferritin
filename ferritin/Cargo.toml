[package]
name = "ferritin"
version = "0.15.1"
edition.workspace = true
description = "Friendly CLI for browsing Rust documentation"
readme = "../README.md"
repository.workspace = true
license.workspace = true
# `client` is a symlink to the workspace-root client; cargo follows it when
# packaging. Only the *built* `dist` ships (it is gitignored, but an explicit
# `include` overrides that), never the source or `node_modules`. That asymmetry
# is load-bearing: `trillium_frontend::frontend!` picks prebuilt-vs-build mode by
# whether the target has a `package.json`, so a repo build sees the source and
# rebuilds the client, while a build from the published tarball sees only `dist`
# and embeds it without needing a node toolchain.
#
# These are gitignore-style globs: an unanchored `CHANGELOG.md` would match a
# file of that name at *any* depth, so the leading `/` matters — without it,
# the client's `node_modules` drags ~200 stray CHANGELOG.md files into the
# package.
include = [
    "src/**/*",
    "build.rs",
    "assets/**/*.tmTheme",
    "assets/og/**/*",
    "/CHANGELOG.md",
    "client/dist/**/*",
]

# dist tags releases per-package as `{crate}-v{version}` (workspace with multiple
# publishable crates), but cargo-binstall's built-in dist auto-detection only
# guesses `v{version}`/`{version}` tags. These templates point binstall at the
# real prefixed tag and the binary's path inside the tarball.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/{ name }-v{ version }/{ name }-{ target }{ archive-suffix }"
pkg-fmt = "txz"
bin-dir = "{ name }-{ target }/{ bin }{ binary-ext }"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

[dependencies]
ferritin-common = { path = "../ferritin-common", version = "0.16.1" }

clap = { version = "4.6.4", features = ["derive", "cargo", "env"] }
crossbeam-channel = "0.5"
crossterm = "0.29"
fieldwork = "0.5.3"
log = "0.4.33"
env_logger = "0.11.11"
pulldown-cmark = "0.13"
ratatui = "0.30"
regex = "1.13"
rustdoc-types.workspace = true
serde.workspace = true
sonic-rs.workspace = true
syntect = { version = "5.3", default-features = false, features = ["parsing", "default-syntaxes", "html", "plist-load", "yaml-load", "dump-load", "dump-create", "regex-onig"] }
terminal_size = "0.4"
thiserror = "2"
unicode-width = "0.2.2"
webbrowser = "1.2.2"
semver = "1.0.28"
percent-encoding = "2.3"
mimalloc = "0.1.52"
schemars = { version = "1.2.2", optional = true }
serde_json = { version = "1.0.151", optional = true }

# `serve`-only. The HTTP server and its crate-name typeahead; see [features].
anyhow = { workspace = true, optional = true }
async-channel = { version = "2.5.0", optional = true }
querystrong = { version = "0.4.0", optional = true }
rayon = { version = "1.12.0", optional = true }
# og:image rendering: parses the card SVG and rasterizes it to PNG. `text` (and
# nothing else) because the card's fonts are embedded — no system font loading,
# no raster image decoding.
resvg = { version = "0.47.0", optional = true, default-features = false, features = ["text"] }
trillium = { version = "1.3.0", optional = true }
# `webpki-roots` is required for `AcmeConfig::new` (the ACME client needs roots
# to trust Let's Encrypt's directory endpoint).
trillium-acme = { version = "0.9.0", features = ["webpki-roots"], optional = true }
trillium-caching-headers = { version = "0.4.2", optional = true }
trillium-client = { version = "0.9.13", optional = true }
trillium-compression = { version = "0.3.3", features = ["client"], optional = true }
trillium-frontend = { version = "0.4.2", optional = true }
trillium-logger = { version = "0.5.4", features = ["client"], optional = true }
trillium-redirect = { version = "0.3.0", features = ["client"], optional = true }
trillium-quinn = { version = "0.1.6", optional = true }
trillium-ratelimit = { version = "0.0.2", optional = true }
trillium-router = { version = "0.5.2", optional = true }
trillium-rustls = { version = "0.11.3", optional = true }
trillium-smol = { version = "0.7.0", optional = true }
trillium-head = { version = "0.3.0", optional = true }
trillium-html-rewriter = { version = "0.6.1", optional = true }

[build-dependencies]
syntect = { version = "5.3", default-features = false, features = ["parsing", "plist-load", "dump-load", "dump-create", "regex-onig"] }

[dev-dependencies]
insta = { version = "1.48.0", features = ["filters"] }
paste = "1.0.15"
strip-ansi-escapes = "0.2.1"

[[bin]]
name = "ferritin"
path = "src/main.rs"

[features]
# The HTTP server (`ferritin serve`): the JSON API plus the embedded web client.
# Off by default — it pulls in the trillium stack, rustls and rayon, none of
# which the CLI or TUI needs. Distributed binaries are built without it. (The
# crate-names artifact reader is *not* here: version resolution reads it too, so
# it lives unconditionally in ferritin-common.)
serve = [
    "dep:anyhow",
    "dep:async-channel",
    "dep:querystrong",
    "dep:rayon",
    "dep:resvg",
    "dep:trillium",
    "dep:trillium-caching-headers",
    "dep:trillium-client",
    "dep:trillium-compression",
    "dep:trillium-frontend",
    "dep:trillium-head",
    "dep:trillium-html-rewriter",
    "dep:trillium-logger",
    "dep:trillium-ratelimit",
    "dep:trillium-redirect",
    "dep:trillium-router",
    "dep:trillium-rustls",
    "dep:trillium-smol",
]

# The Model Context Protocol server: a stateless Streamable-HTTP MCP endpoint
# (`/mcp`, a sibling to `/api`) exposing `get` and `search` as tools that return
# agent-format documentation text. Off by default. Implies `serve` — it rides
# the same shared `Store` and big-stack worker pool — and adds the JSON-RPC/MCP
# protocol types (serde_json) and their input schemas (schemars).
mcp = ["serve", "dep:serde_json", "dep:schemars"]

# Deployment-only: automatic HTTPS via Let's Encrypt (tls-alpn-01) plus HTTP/3,
# activated at runtime by `FERRITIN_ACME_DOMAIN` (absent it, `serve` runs
# cleartext exactly as without this feature). Off by default — users running a
# local `serve` don't need trillium-acme, rustls-acme, or quinn.
acme = ["serve", "dep:trillium-acme", "dep:trillium-quinn"]

# Development-only: emit the OpenAPI schema for the JSON API (`ferritin schema`).
# Off by default so normal builds don't pull in schemars; the generated schema is
# committed under assets/ and regenerated as a dev task. Implies `serve`: the
# schema describes that server's endpoints and their models.
schema = ["dep:schemars", "serve"]

# Development-only: serve the client from a spawned Vite dev server (with HMR)
# instead of the assets embedded at compile time.
dev-proxy = ["serve", "trillium-frontend/dev-proxy"]
