[workspace]
features_always_increment_minor = true
# Leave the GitHub Release as a draft with the changelog as its body. dist's
# release workflow (create-release = false in dist-workspace.toml) then uploads
# the prebuilt binaries/installers to it and undrafts when the upload completes.
git_release_draft = true

# ferritin-common is a library with no binaries, so dist can't build a release
# for it. Suppress its git tag and GitHub release entirely — otherwise a
# `ferritin-common-v*` tag would trigger dist's release.yml and fail. It still
# publishes to crates.io as a dependency of the two binaries.
[[package]]
name = "ferritin-common"
git_tag_enable = false
git_release_enable = false

# ferritin's `include` ships `client/dist`, which is gitignored and built by the
# release workflow's `pnpm build` step. Cargo's VCS check runs before packaging
# and rejects package files that aren't committed, so the very assets we mean to
# ship read as "uncommitted changes" and abort the publish. Scoped to this
# package rather than the workspace: ferritin-common and rustdoc-mcp have no
# build artifacts and should keep the strict check. The blast radius here is
# exactly `client/dist` — the CI checkout is clean, and the only other thing
# `pnpm build` writes is `node_modules`, which `include` does not match.
[[package]]
name = "ferritin"
publish_allow_dirty = true
